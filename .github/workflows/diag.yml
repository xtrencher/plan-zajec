name: diag
on: [workflow_dispatch]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          C="curl -4 -sS --connect-timeout 60 -m 120 --retry 5 --retry-all-errors --retry-delay 3"
          $C https://a2c.uek.krakow.pl/ -o index.html || true
          grep -oE '(src|href)="[^"]+\.(js|mjs)[^"]*"' index.html || true
          for s in $(grep -oE 'src="[^"]+\.m?js[^"]*"' index.html | sed 's/src="//;s/"$//'); do
            case $s in http*) u=$s;; /*) u=https://a2c.uek.krakow.pl$s;; *) u=https://a2c.uek.krakow.pl/$s;; esac
            $C "$u" -o s.js || continue
            echo "== $u"; grep -oE '.{0,160}(api/calendar|lektor)[^;]{0,200}' s.js | head -20
          done
          grep -oE '.{0,160}(api/calendar|lektor)[^<]{0,200}' index.html | head -20
