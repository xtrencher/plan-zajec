name: diag
on: [workflow_dispatch, push]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://a2c.uek.krakow.pl/api/calendar?url=https%3A%2F%2Fplanzajec.uek.krakow.pl%2Findex.php%3Ftyp%3DG%26id%3D171271%26okres%3D3'
          for i in 1 2 3 4 5 6; do curl -4 -sS --connect-timeout 60 -m 120 -o out.ics -w "try$i %{http_code} connect=%{time_connect} total=%{time_total} size=%{size_download}\n" "$U" || true; done
          head -c 300 out.ics || true
          for i in 1 2 3; do curl -4 -sS --connect-timeout 60 -m 60 -o /dev/null -w "planzajec %{http_code} connect=%{time_connect}\n" https://planzajec.uek.krakow.pl/ || true; done
